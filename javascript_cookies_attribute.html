<body>

    <input type="button" value="getcookie" onclick="get_cookies()">

    <script>

            document.cookie= "username = duke martin; expires = sun ,20 aug 2030 12:00:00 UTC;path=/"
            document.cookie= "city= delhi; expires = sun,20 aug 2030 12:00:00 UTC; path=/"

        function get_cookies(){

            }
        }
